[package]
name = "kern-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kern"
path = "src/main.rs"

[dependencies]
kern-mcp.workspace = true
kern-ontology.workspace = true
kern-ingest.workspace = true
kern-vector.workspace = true
kern-model.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true
futures.workspace = true
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.1", features = ["server", "macros", "transport-io"] }
dirs = "5"
tar = { version = "0.4.46", optional = true }
flate2 = { version = "1.1.9", optional = true }

[features]
# Enabled only by the CI release (.github/workflows/release.yml) — embeds
# llama-server + shared libs via include_bytes!, see src/embedded.rs.
# Dev/PR builds go without it: no embedded binary, only opportunistic Ollama.
bundled-llama-server = ["dep:tar", "dep:flate2"]

[dev-dependencies]
tempfile = "3"
async-trait.workspace = true
