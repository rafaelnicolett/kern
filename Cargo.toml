[workspace]
resolver = "2"
members = [
    "kern-ingest",
    "kern-vector",
    "kern-ontology",
    "kern-model",
    "kern-mcp",
    "kern-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kern-dev/kern"

# Dependências compartilhadas — versão única fixada aqui, crates referenciam
# via `dep.workspace = true`. Evita drift de versão entre crates do mesmo
# workspace (ver Skill lang-rust, seção 1).
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "fs", "io-util", "time"] }
async-trait = "0.1"
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

kern-ingest = { path = "kern-ingest" }
kern-vector = { path = "kern-vector" }
kern-ontology = { path = "kern-ontology" }
kern-model = { path = "kern-model" }
kern-mcp = { path = "kern-mcp" }
