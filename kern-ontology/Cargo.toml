[package]
name = "kern-ontology"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kern-model.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
uuid.workspace = true
tracing.workspace = true
# bundled: compila o SQLite a partir do source, sem exigir libsqlite3 do
# sistema — necessário pro binário final ser realmente autocontido.
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json.workspace = true
# Só pra extrair as CHAVES do bloco de frontmatter YAML — nunca os valores
# viram parte do fingerprint (docs/domain/ontologia/aggregates.md, Agregado 3).
serde_yaml = "0.9"
blake3 = "1"

[dev-dependencies]
tempfile = "3"
