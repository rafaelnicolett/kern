[package]
name = "kern-ontology"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kern-model.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
uuid.workspace = true
tracing.workspace = true
# bundled: compiles SQLite from source, without requiring the system's
# libsqlite3 — necessary for the final binary to be truly self-contained.
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json.workspace = true
# Only to extract the KEYS from the YAML frontmatter block — the values
# never become part of the fingerprint.
serde_yaml = "0.9"
blake3 = "1"

[dev-dependencies]
tempfile = "3"
