[package]
name = "kern-vector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
uuid.workspace = true
tracing.workspace = true
# 0.4.x was pinned by mistake (outdated training-data version) — the real
# latest is 0.33.x (Jul/2026). No separate version pin for
# arrow-array/arrow-schema: use exactly what lancedb already brings in.
lancedb = "0.33"
futures = "0.3"

# No direct dependency on arrow-array/arrow-schema: use the types re-exported
# via `lancedb::arrow::*`, otherwise Cargo's resolver pulls in a second arrow
# tree (a newer version) that's type-incompatible with the one lancedb uses
# internally (empirically confirmed).

[dev-dependencies]
tempfile = "3"
# Only for the end-to-end integration test (tests/pipeline.rs) — kern-vector
# itself doesn't depend on kern-ingest/kern-model in production.
kern-ingest.workspace = true
kern-model.workspace = true
