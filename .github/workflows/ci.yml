name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lance-encoding (a transitive dependency via lancedb) compiles .proto
      # files with prost-build in build.rs — it needs the `protoc` binary on
      # PATH, and the GitHub runner doesn't ship it by default (real finding:
      # local builds worked because this Mac already had protoc via
      # Homebrew, masking the gap until the first CI run).
      - name: Install protoc (protobuf-compiler)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Installs exactly the toolchain pinned in rust-toolchain.toml — never
      # a loose `stable` channel.
      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kern-ci"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace
        # Real integration tests against Ollama (`extract`/`judge`/`embed`)
        # skip gracefully (don't fail) when the daemon isn't available —
        # CI doesn't need Ollama installed.

      - name: Validate committed Cargo.lock
        run: cargo update --workspace --locked
        # Fails if Cargo.lock is out of date relative to Cargo.toml —
        # guarantees the committed lockfile is what CI actually used.

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # rustsec/audit-check publishes its result as a GitHub Check Run —
    # without this, the job runs the audit (which passes) and only fails on
    # publishing, with "Resource not accessible by integration" (real
    # finding: the default GITHUB_TOKEN permissions on a new repo don't
    # include checks:write).
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
