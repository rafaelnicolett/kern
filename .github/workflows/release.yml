name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # Reference llama.cpp build used to assemble the bundled package — pinned
  # explicitly (never a loose "latest" at build time, same rationale as
  # rust-toolchain.toml). Bumping this is a deliberate decision, tested
  # manually before the bump.
  LLAMA_CPP_RELEASE_TAG: b10298

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux arm64 and Windows are out of scope for this v0 —
          # llama-server on those targets needs its own verification (DLL
          # packaging on Windows, a Linux-hosted arm64 runner) not done yet.
          # Deliberate partial scope, not a descope.
          - os: macos-14 # native Apple Silicon
            target: aarch64-apple-darwin
            llama_asset_suffix: macos-arm64
          - os: macos-13 # native Intel
            target: x86_64-apple-darwin
            llama_asset_suffix: macos-x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            llama_asset_suffix: ubuntu-x64
    steps:
      - uses: actions/checkout@v4

      # lance-encoding (a transitive dependency via lancedb) compiles .proto
      # files with prost-build in build.rs — it needs the `protoc` binary on
      # PATH, and the GitHub runners don't ship it by default (same finding
      # as ci.yml: local builds only worked because protoc was already on
      # this machine via Homebrew).
      - name: Install protoc (protobuf-compiler)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          else
            brew install protobuf
          fi

      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kern-release-${{ matrix.target }}"

      - name: Download and extract the llama.cpp release for this platform
        shell: bash
        run: |
          set -euo pipefail
          asset="llama-${LLAMA_CPP_RELEASE_TAG}-bin-${{ matrix.llama_asset_suffix }}.tar.gz"
          url="https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_RELEASE_TAG}/${asset}"
          echo "downloading ${url}"
          curl -sL --fail -o /tmp/llama-release.tar.gz "${url}"
          mkdir -p /tmp/llama-release
          tar xzf /tmp/llama-release.tar.gz -C /tmp/llama-release --strip-components=1

      - name: Assemble the bundled package (llama-server + shared libs)
        shell: bash
        run: |
          set -euo pipefail
          bundle=/tmp/llama-bundle
          mkdir -p "$bundle"
          cp /tmp/llama-release/llama-server "$bundle"/
          cp /tmp/llama-release/LICENSE "$bundle"/LICENSE-llama-cpp
          # Never hand-pick a "minimal" subset of libs — ggml's dependency
          # graph changes between releases (new CPU/Metal/RPC backends);
          # bundling everything that shipped in the official release is the
          # only robust way to guarantee the dynamic linker finds
          # everything (verified manually: llama-server fails to load
          # without its sibling libs).
          cp /tmp/llama-release/*.dylib "$bundle"/ 2>/dev/null || true
          cp /tmp/llama-release/*.so* "$bundle"/ 2>/dev/null || true
          tar czf /tmp/llama-server-bundle.tar.gz -C "$bundle" .
          ls -lh /tmp/llama-server-bundle.tar.gz

      - name: cargo build --release (with llama-server bundled in)
        env:
          KERN_LLAMA_SERVER_ARCHIVE: /tmp/llama-server-bundle.tar.gz
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release -p kern-cli --features bundled-llama-server --target ${{ matrix.target }}

      - name: Package the artifact
        shell: bash
        run: |
          set -euo pipefail
          out=kern-${{ matrix.target }}
          mkdir -p "$out"
          bin="target/${{ matrix.target }}/release/kern"
          [ -f "$bin" ] || bin="target/${{ matrix.target }}/release/kern.exe"
          cp "$bin" "$out"/
          cp README.md LICENSE-MIT LICENSE-APACHE "$out"/
          tar czf "$out.tar.gz" "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: kern-${{ matrix.target }}
          path: kern-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Only runs on a tag push (`v*`) — workflow_dispatch exists to test the
  # build matrix in isolation, without publishing a release. Collects the
  # artifacts from the 3 matrix jobs and attaches them to a GitHub Release,
  # in the shape the README expects
  # (`releases/latest/download/kern-<target>.tar.gz`).
  publish:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kern-*
          merge-multiple: true
          path: dist

      - name: softprops/action-gh-release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
