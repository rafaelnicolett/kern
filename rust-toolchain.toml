[toolchain]
# MSRV — pinned explicitly, never "always latest" via the `stable` channel.
#
# Bump history (keep this updated as the file evolves):
# - 1.75.0: first stable with native async fn in traits.
# - 1.85.0: lancedb/arrow required the `edition2024` feature.
# - 1.97.1: lancedb's transitive dependency tree (icu_*, time) raised the
#   requirement again, more than once, up to the current stable at the time
#   (2026-07-14). Empirically, `lancedb` as a dependency leaves no room for
#   a classic conservative MSRV — we pin the actual stable resolved at the
#   time, not the `stable` channel (which would drift on every
#   `rustup update`).
#
# Revisit this pin if a future `lancedb`/`arrow` release relaxes its own
# MSRV requirements.
channel = "1.97.1"
components = ["rustfmt", "clippy"]
